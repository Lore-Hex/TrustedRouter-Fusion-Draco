[project]
name = "trustedrouter-fusion-draco"
version = "0.1.0"
description = "Reproduction of OpenRouter's Fusion DRACO deep-research benchmark on TrustedRouter, with an agentic web_search / web_fetch / bash harness."
requires-python = ">=3.11"
dependencies = [
    "trusted-router-py>=0.3.0",  # our SDK — every gateway call goes through it
    "httpx",                     # Exa search + web_fetch only (not the gateway)
]

[project.optional-dependencies]
# Full Inspect fetch parsing runs inside AnyEval's dedicated fetch image, not its worker.
# Keeping markitdown out of the base dependencies prevents the worker from inheriting
# onnxruntime and the rest of markitdown[all]. The standalone harness already imports
# markitdown behind try/except and degrades to plain-text fetch without it.
inspect = ["inspect-ai"]
harness = ["markitdown[all]"]

[project.entry-points.inspect_ai]
draco = "draco"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trusted_router", "src/draco"]
exclude = ["src/draco/data/draco_sample20.json"]

[tool.hatch.build.targets.wheel.force-include]
"draco_sample20.json" = "draco/data/draco_sample20.json"

[tool.uv]
package = true
